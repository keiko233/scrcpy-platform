allowBuilds:
  esbuild: true
  electron: true
  # electron-builder's Windows installer dependency; its postinstall stages
  # helper binaries.
  electron-winstaller: true
  # Its postinstall only prints an OpenCollective message; runtime files are
  # already present in the package, so explicitly skip it.
  tesseract.js: false
minimumReleaseAgeExclude:
  - '@tanstack/router-core@1.171.26'
  - '@tanstack/router-generator@1.167.32'
  - '@tanstack/router-plugin@1.168.34'
  - electron@43.4.1
  - '@tanstack/react-router@1.170.31'
