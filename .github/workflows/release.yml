name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump from the latest vX.Y.Z tag
        type: choice
        required: true
        default: patch
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  actions: write

jobs:
  version:
    name: Bump version, tag and trigger build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          VERSION=$(pnpm exec tsx scripts/release-version.ts "$BUMP")
          git add package.json
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin main "v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Tags pushed with the default GITHUB_TOKEN do not emit `push` events,
      # so the tag alone cannot trigger the build workflow. Dispatch it
      # explicitly instead; tags pushed by a real user still trigger it.
      - name: Dispatch release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh workflow run release-build.yml --ref "v${VERSION}" -f tag="v${VERSION}"; then
              exit 0
            fi
            sleep 5
          done
          echo "Failed to dispatch release-build.yml for v${VERSION}" >&2
          exit 1
